name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Build approvals (esbuild) live in pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile

      # Generates .nuxt types, which the typecheck depends on.
      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
