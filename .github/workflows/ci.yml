name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Reads packageManager and devEngines.runtime from package.json, so the
      # pnpm and Node versions here cannot drift from the project's. Requires
      # the lockfile and installs with --frozen-lockfile.
      - name: Setup pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          require-lockfile: true

      # Generates .nuxt types, which the typecheck depends on.
      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # The publish workflow only runs after this one is green, so a Dockerfile
      # that no longer builds is caught here rather than after a push.
      - name: Build image
        run: docker build -t pachas:ci .