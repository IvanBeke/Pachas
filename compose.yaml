services:
  dev:
    image: ghcr.io/pnpm/pnpm:12
    profiles: [tooling]
    working_dir: /app
    volumes:
      - .:/app
      - pachas-dev-node-modules:/app/node_modules

  pachas:
    build: .
    image: pachas:latest
    container_name: pachas
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pachas-data:/data
    environment:
      PORT: "3000"
      DATABASE_PATH: ${DATABASE_PATH:-/data/pachas.sqlite}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env file}
      ALLOW_REGISTRATION: "true"
      COOKIE_SECURE: "false"

volumes:
  pachas-data:
  pachas-dev-node-modules:
